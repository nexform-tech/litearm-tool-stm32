name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt5 wheels need these shared libraries even with the offscreen platform.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install
        # litearm-python is not on PyPI; install the pinned public commit that
        # provides the 2.4.x fault-detail / error-description API this branch uses.
        # The project is not pip-installable on this branch (flat layout), so tests
        # rely on `pythonpath = ["."]` from pyproject.toml instead of `pip install -e .`.
        run: |
          pip install "litearm-python @ git+https://github.com/nexform-tech/litearm-python.git@0e43a2ffa5de1bdf34bf94360cc8df0b729da157"
          pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # Windows is the platform the release bundle is built on; testing it only in
  # the release job meant a red suite there produced a tag with no Windows
  # asset. Run the same offline suite on windows-latest for every PR.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install "litearm-python @ git+https://github.com/nexform-tech/litearm-python.git@0e43a2ffa5de1bdf34bf94360cc8df0b729da157"
          pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt5 wheels need these shared libraries even with the offscreen platform.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install
        # litearm-python 2.1.0 is not on PyPI; install the pinned public commit.
        # The project is not pip-installable on this branch (flat layout), so tests
        # rely on `pythonpath = ["."]` from pyproject.toml instead of `pip install -e .`.
        run: |
          pip install "litearm-python @ git+https://github.com/nexform-tech/litearm-python.git@5643e477db6dd74c3283bb92cdad8b62ec627f02"
          pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
